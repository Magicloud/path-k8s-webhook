apiVersion: v1
kind: Service
metadata:
  name: whoami
spec:
  type: LoadBalancer
  selector:
    app: whoami
  loadBalancerSourceRanges:
    - "1.1.1.1/32"
    - "2.2.2.2/32"
    - "3.3.3.3/32"
  ports:
  - name: http
    protocol: TCP
    port: 8888
    targetPort: 80
  - name: https
    protocol: TCP
    port: 8899
    targetPort: 443