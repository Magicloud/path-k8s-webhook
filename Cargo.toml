[package]
name = "path-k8s-webhook"
edition = "2024"
version = "2026.10.17"
description = "Kubernetes AdmissionControl webhook to validate or mutate specified resource via JSON Ptr"
license = "Apache-2.0"
repository = "https://github.com/Magicloud/path-k8s-webhook"
keywords = ["Kubernetes", "Webhook"]
categories = ["config"]

[profile.release]
strip = true
lto = true
codegen-units = 1
# opt-level = "z"
opt-level = 3
panic = "abort"

[dependencies]
mimalloc = { version = "0.1" }
eyre = { version = "0.6" }
color-eyre = { version = "0.6" }
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.53", features = ["full"] }
xitca-web = { version = "0.8", features = [
    "io-uring",
    "rustls",
    "json",
    "codegen",
    "tracing",
    "tracing-subscriber",
] }
rustls = { version = "0.23" }
rustls-pemfile = { version = "2.2" }
k8s-openapi = { version = "0.28", default-features = false, features = [
    "std",
    "earliest",
] }
kube = { version = "4.2", features = ["admission", "client", "http-proxy"] }
jsonptr = { version = "0.8" }
json-patch = { version = "4.2" }
evalexpr = { version = "13.1" }
# itertools = { version = "0.15" }
futures = { version = "0.3", features = ["alloc"] }
serde_json = { version = "1.0" }
macroweave = { version = "0.1" }
inotify = { version = "0.11" }
arc-swap = { version = "1.9" }
# crossfire = { version = "3.1" }
tracing = { version = "0.1" }
tracing-error = { version = "0.2" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# tracing-opentelemetry = { version = "0.32" }
# opentelemetry = { version = "0.31" }
# opentelemetry_sdk = { version = "0.31" }
# opentelemetry-appender-tracing = { version = "0.31" }
# opentelemetry-otlp = { version = "0.31", default-features = false, features = [
#     "logs",
#     "trace",
#     "grpc-tonic",
# ] }
# opentelemetry-stdout = { version = "0.31" }
# ouroboros = { version = "0.18" }
# random_str = { version = "1" }
# tracing-actix-web = { version = "0.7" }

[[test]]
name = "it"
path = "tests/it.rs"
harness = false

[dev-dependencies]
serde_yaml_ng = { version = "0.10" }
yaml-split = { version = "0.4" }
#async-safe-defer = { version = "*" }
#guarden = { version = "*" }
async-drop = { version = "0.1" }
kube = { version = "4.2", features = ["runtime", "ws"] }
serde_json_diff = { version = "0.2" }
libtest-mimic = { version = "0.8" }
async-result-ext = { version = "0.1" }
